name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: sync-upstream-dev
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/dev into fork/dev
        run: |
          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream dev
          git checkout dev
          git pull --ff-only origin dev

          base="$(git rev-parse HEAD)"
          if ! git merge --no-edit upstream/dev; then
            for file in $(git diff --name-only --diff-filter=U); do
              case "$file" in
                .github/workflows/sync-upstream.yml|.github/workflows/fork-auto-release.yml)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                .github/workflows/*)
                  git rm "$file"
                  ;;
                packages/opencode/src/agent/agent.ts|packages/opencode/src/cli/cmd/auth.ts|packages/opencode/src/cli/cmd/providers.ts|packages/opencode/src/plugin/codex.ts|packages/opencode/src/provider/provider.ts|packages/opencode/src/cli/cmd/tui/routes/session/header.tsx|packages/opencode/src/installation/index.ts|packages/opencode/src/session/llm.ts|packages/opencode/src/session/prompt.ts)
                  git checkout --ours -- "$file"
                  git add "$file"
                  ;;
                *)
                  echo "Unhandled merge conflict in $file"
                  exit 1
                  ;;
              esac
            done

            git commit -m "chore(fork): auto-resolve workflow merge conflicts"
          fi
          head="$(git rev-parse HEAD)"

          find .github/workflows -maxdepth 1 -type f -name "*.yml" \
            ! -name "sync-upstream.yml" \
            ! -name "fork-auto-release.yml" \
            -delete

          if ! git diff --quiet -- .github/workflows; then
            git add .github/workflows
            git commit -m "chore(fork): keep minimal workflows"
          fi

          if [ "$base" = "$head" ] && git diff --quiet; then
            echo "Already up to date"
            exit 0
          fi

          git push origin dev
