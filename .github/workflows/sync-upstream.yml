name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

concurrency:
  group: sync-upstream-release
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge latest upstream release into fork/dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          official_tag="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name)"
          if [ -z "$official_tag" ]; then
            echo "Failed to resolve latest upstream release tag"
            exit 1
          fi

          git remote add upstream https://github.com/anomalyco/opencode.git
          git fetch upstream "refs/tags/${official_tag}:refs/tags/${official_tag}"
          git checkout dev
          git pull --ff-only origin dev

          release_sha="$(git rev-list -n 1 "$official_tag")"
          if git merge-base --is-ancestor "$release_sha" HEAD; then
            echo "Fork already contains upstream release ${official_tag}"
            exit 0
          fi

          keep_ours() {
            local file="$1"
            local item
            for item in \
              packages/opencode/script/codex-usage.ts \
              packages/opencode/src/agent/agent.ts \
              packages/opencode/src/agent/prompt/title.txt \
              packages/opencode/src/cli/cmd/auth.ts \
              packages/opencode/src/cli/cmd/providers.ts \
              packages/opencode/src/cli/cmd/tui/component/dialog-session-list.tsx \
              packages/opencode/src/cli/cmd/tui/component/dialog-status.tsx \
              packages/opencode/src/cli/cmd/tui/component/prompt/index.tsx \
              packages/opencode/src/cli/cmd/tui/routes/session/header.tsx \
              packages/opencode/src/cli/cmd/tui/routes/session/index.tsx \
              packages/opencode/src/cli/cmd/tui/routes/session/sidebar.tsx \
              packages/opencode/src/cli/cmd/tui/util/codex-usage.ts \
              packages/opencode/src/cli/cmd/upgrade.ts \
              packages/opencode/src/command/index.ts \
              packages/opencode/src/config/config.ts \
              packages/opencode/src/installation/index.ts \
              packages/opencode/src/plugin/codex.ts \
              packages/opencode/src/provider/profile.ts \
              packages/opencode/src/provider/provider.ts \
              packages/opencode/src/provider/transform.ts \
              packages/opencode/src/server/routes/session.ts \
              packages/opencode/src/share/share-next.ts \
              packages/opencode/src/session/compaction.ts \
              packages/opencode/src/session/index.ts \
              packages/opencode/src/session/llm.ts \
              packages/opencode/src/session/prompt.ts \
              packages/opencode/test/provider/profile.test.ts \
              packages/opencode/test/provider/provider.test.ts \
              packages/opencode/test/provider/transform.test.ts \
              packages/opencode/test/session/compaction.test.ts \
              packages/opencode/test/share/share-next.test.ts \
              packages/opencode/test/session/title.test.ts; do
              if [ "$file" = "$item" ]; then
                return 0
              fi
            done
            return 1
          }

          base="$(git rev-parse HEAD)"
          if ! git merge --no-edit "$release_sha"; then
            for file in $(git diff --name-only --diff-filter=U); do
              case "$file" in
                .github/workflows/sync-upstream.yml|.github/workflows/fork-auto-release.yml)
                  git checkout --ours -- "$file"
                  git add "$file"
                  continue
                  ;;
                .github/workflows/*)
                  git rm "$file"
                  continue
                  ;;
              esac

              if keep_ours "$file"; then
                git checkout --ours -- "$file"
                git add "$file"
                continue
              fi

              echo "Unhandled merge conflict in $file"
              exit 1
            done

            git commit -m "chore(fork): auto-resolve release sync conflicts"
          fi
          head="$(git rev-parse HEAD)"

          find .github/workflows -maxdepth 1 -type f -name "*.yml" \
            ! -name "sync-upstream.yml" \
            ! -name "fork-auto-release.yml" \
            -delete

          if ! git diff --quiet -- .github/workflows; then
            git add .github/workflows
            git commit -m "chore(fork): keep minimal workflows"
          fi

          if [ "$base" = "$head" ] && git diff --quiet; then
            echo "Already up to date"
            exit 0
          fi

          git push origin dev
