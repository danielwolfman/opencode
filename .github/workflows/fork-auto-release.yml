name: Fork Auto Release

on:
  workflow_run:
    workflows:
      - Sync Upstream
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-auto-release-dev
  cancel-in-progress: true

jobs:
  release:
    if: >-
      github.repository == 'danielwolfman/opencode' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'dev'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          official_tag="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name)"
          official_version="${official_tag#v}"
          head_sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=10 HEAD)"
          version="${official_version}-daniel-fork-${short_sha}"

          echo "official_version=${official_version}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_VERSION: ${{ steps.version.outputs.official_version }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release already exists for ${{ steps.version.outputs.head_sha }}; skipping"
            exit 0
          fi

          echo "exists=false" >> "$GITHUB_OUTPUT"

          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Automated fork release for ${{ steps.version.outputs.head_sha }} (upstream ${OFFICIAL_VERSION})"

      - name: Build and upload release assets
        if: steps.release.outputs.exists != 'true'
        working-directory: packages/opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_RELEASE: "1"
          OPENCODE_UPDATE_REPO: ${{ github.repository }}
        run: bun run script/build.ts

      - name: Build and upload plugin package
        if: steps.release.outputs.exists != 'true'
        working-directory: packages/plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun run script/pack.ts
          gh release upload "${{ steps.version.outputs.tag }}" ./dist/*.tgz --clobber --repo "${GH_REPO}"

      - name: Publish release
        if: steps.release.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false
