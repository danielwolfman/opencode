name: Fork Auto Release

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fork-auto-release-dev
  cancel-in-progress: true

jobs:
  release:
    if: github.repository == 'danielwolfman/opencode'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          official_tag="$(gh api repos/anomalyco/opencode/releases/latest --jq .tag_name)"
          official_version="${official_tag#v}"
          short_sha="$(git rev-parse --short=10 "${GITHUB_SHA}")"
          version="${official_version}-daniel-fork-${short_sha}"

          echo "official_version=${official_version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${short_sha}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OFFICIAL_VERSION: ${{ steps.version.outputs.official_version }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            gh release delete "${{ steps.version.outputs.tag }}" --yes --cleanup-tag
          fi

          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "${{ steps.version.outputs.tag }}" \
            --notes "Automated fork release for ${GITHUB_SHA} (upstream ${OFFICIAL_VERSION})"

      - name: Build and upload release assets
        working-directory: packages/opencode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OPENCODE_CHANNEL: latest
          OPENCODE_VERSION: ${{ steps.version.outputs.version }}
          OPENCODE_RELEASE: "1"
        run: bun run script/build.ts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ steps.version.outputs.tag }}" --draft=false
